name: SamsungReminder
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "26.0"
  generateEmptyDirectories: true
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
  configs:
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: -O
targets:
  SamsungReminder:
    type: application
    platform: macOS
    sources:
      - Sources/Core/Shared
      - Sources/Core/Cloud
      - Sources/App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).SamsungReminder
        INFOPLIST_FILE: Sources/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/App/SamsungReminder.entitlements
        PRODUCT_NAME: Samsung Reminder
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
    dependencies:
      - target: SamsungReminderWidget
        embed: true
  SamsungReminderWidget:
    type: app-extension
    platform: macOS
    sources:
      - Sources/Core/Shared
      - Sources/Widget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).SamsungReminder.Widget
        INFOPLIST_FILE: Sources/Widget/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/Widget/SamsungReminderWidget.entitlements
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks @executable_path/../../../../Frameworks"
  ReminderCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/ReminderCoreTests
    dependencies:
      - target: SamsungReminder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).SamsungReminder.Tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Samsung Reminder.app/Contents/MacOS/Samsung Reminder
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  SamsungReminder:
    build:
      targets:
        SamsungReminder: all
        SamsungReminderWidget: all
        ReminderCoreTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [ReminderCoreTests]
